[project]
name = "streamlit-template"
version = "0.1.0"
description = "Streamlit template for multiple applications"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "streamlit>=1.60,<1.61",
    "pandas>=2.3,<3",
    "plotly>=6.3,<7",
    "numpy>=2,<3",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<0.14",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
